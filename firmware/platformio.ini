; PlatformIO build for the Hybrid-Flow firmware.
;   pio run -e esp32dev -t upload     bench demo: knobs stand in for the sensors (default)
;   pio run -e field -t upload        field build with the real sensors and the SSR
;   pio run -e wokwi                  bench circuit in the Wokwi simulator (see wokwi.toml)
[platformio]
src_dir = hybrid_flow
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:esp32dev]

[env:field]
build_flags = -DSIM_INPUTS=0

[env:wokwi]
build_flags = -DWOKWI_SIM=1
