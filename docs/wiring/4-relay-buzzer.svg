ont-weight="700" fill="#17201b" text-anchor="end">IN4</text><path d="M242 310 L354 310 L354 296 L530 296" fill="none" stroke="#7a3fb0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="236" cy="350" r="6" fill="#e8c35a"/><text x="220" y="355" font-size="14" font-weight="700" fill="#fff" text-anchor="end">5V</text><rect x="576" y="329" width="18" height="18" fill="#bbb"/><text x="568" y="343" font-size="14" font-weight="700" fill="#17201b" text-anchor="end">VCC</text><path d="M242 350 L362 350 L362 338 L530 338" fill="none" stroke="#c96a00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="236" cy="390" r="6" fill="#e8c35a"/><text x="220" y="395" font-size="14" font-weight="700" fill="#fff" text-anchor="end">GND</text><rect x="576" y="371" width="18" height="18" fill="#bbb"/><text x="568" y="385" font-size="14" font-weight="700" fill="#17201b" text-anchor="end">GND</text><path d="M242 390 L370 390 L370 380 L530 380" fill="none" stroke="#17201b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="472" font-size="14" font-weight="600" fill="#17201b" text-anchor="start">Female-female wires, ESP32 pin to relay pin.</text><text x="560" y="492" font-size="13" font-weight="400" fill="#5b6961" text-anchor="start">Pin order on your module may differ: match the labels.</text><rect x="60" y="500" width="190" height="110" rx="10" fill="#1c3f8f"/><circle cx="120" cy="555" r="32" fill="#111"/><text x="200" y="560" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Buzzer</text><rect x="250" y="517" width="16" height="16" fill="#bbb"/><text x="274" y="530" font-size="14" font-weight="700" fill="#17201b" text-anchor="start">VCC</text><path d="M320 525 L420 525" fill="none" stroke="#d03a2f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="530" font-size="14" font-weight="700" fill="#d03a2f" text-anchor="start">breadboard + rail (3V3)</text><rect x="250" y="547" width="16" height="16" fill="#bbb"/><text x="274" y="560" font-size="14" font-weight="700" fill="#17201b" text-anchor="start">I/O</text><path d="M320 555 L420 555" fill="none" stroke="#7a3fb0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="560" font-size="14" font-weight="700" fill="#7a3fb0" text-anchor="start">ESP32 GPIO19</text><rect x="250" y="577" width="16" height="16" fill="#bbb"/><text x="274" y="590" font-size="14" font-weight="700" fill="#17201b" text-anchor="start">GND</text><path d="M320 585 L420 585" fill="none" stroke="#2a5bd0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="590" font-size="14" font-weight="700" fill="#2a5bd0" text-anchor="start">breadboard − rail (GND)</text><text x="60" y="650" font-size="14" font-weight="400" fill="#5b6961" text-anchor="start">Buzzer: male-female wires. 2-pin buzzer: + → GPIO19, − → GND.</text><text x="60" y="672" font-size="14" font-weight="400" fill="#5b6961" text-anchor="start">If it beeps when it should be quiet, set BUZZER_ACTIVE_LOW 1 in config.h.</text></svg>