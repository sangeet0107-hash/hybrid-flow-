rx="1.5" fill="#c9c4b5"/><rect x="306" y="418" width="8" height="8" rx="1.5" fill="#c9c4b5"/><rect x="328" y="418" width="8" height="8" rx="1.5" fill="#c9c4b5"/><rect x="350" y="418" width="8" height="8" rx="1.5" fill="#c9c4b5"/><rect x="372" y="418" width="8" height="8" rx="1.5" fill="#c9c4b5"/><rect x="394" y="418" width="8" height="8" rx="1.5" fill="#c9c4b5"/><rect x="416" y="418" width="8" height="8" rx="1.5" fill="#c9c4b5"/><rect x="438" y="418" width="8" height="8" rx="1.5" fill="#c9c4b5"/><rect x="460" y="418" width="8" height="8" rx="1.5" fill="#c9c4b5"/><text x="90" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">1</text><text x="112" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">2</text><text x="134" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">3</text><text x="156" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">4</text><text x="178" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">5</text><text x="200" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">6</text><text x="222" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">7</text><text x="244" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">8</text><text x="266" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">9</text><text x="288" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">10</text><text x="310" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">11</text><text x="332" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">12</text><text x="354" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">13</text><text x="376" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">14</text><text x="398" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">15</text><text x="420" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">16</text><text x="442" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">17</text><text x="464" y="190" font-size="10" font-weight="400" fill="#5b6961" text-anchor="middle">18</text><rect x="80" y="306" width="396" height="12" fill="#e2ddcf"/><rect x="146" y="192" width="20" height="108" rx="6" fill="none" stroke="#1f9d55" stroke-width="3"/><text x="540" y="180" font-size="15" font-weight="600" fill="#d03a2f" text-anchor="start">Red + rail: every hole in the row is joined.</text><text x="540" y="202" font-size="15" font-weight="600" fill="#2a5bd0" text-anchor="start">Blue − rail: same. These carry 3.3 V and GND.</text><text x="540" y="250" font-size="15" font-weight="600" fill="#1f9d55" text-anchor="start">Green: the 5 holes a–e in one column are</text><text x="540" y="272" font-size="15" font-weight="600" fill="#1f9d55" text-anchor="start">joined to each other (f–j likewise).</text><text x="540" y="320" font-size="15" font-weight="600" fill="#17201b" text-anchor="start">The middle gap separates a–e from f–j.</text><text x="540" y="368" font-size="15" font-weight="400" fill="#17201b" text-anchor="start">Nothing else is connected: different columns</text><text x="540" y="390" font-size="15" font-weight="400" fill="#17201b" text-anchor="start">are separate until you add a wire.</text><text x="60" y="470" font-size="15" font-weight="600" fill="#c96a00" text-anchor="start">⚠ On long 840-hole boards the rails are often split in the middle (look for a break in the red/blue line).</text><text x="60" y="494" font-size="15" font-weight="400" fill="#c96a00" text-anchor="start">   If yours is split, bridge the two halves with a short male-male wire, or keep all parts on one half.</text></svg>