<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="720" fill="#fff"/><text x="28" y="44" font-size="26" font-weight="700" fill="#17201b">Step 2 · The ESP32 pins you'll use</text><text x="28" y="72" font-size="15" fill="#5b6961">38-pin ESP32 seen from the top (the side with the metal shield)</text><rect x="400" y="110" width="200" height="516" rx="12" fill="#1f2b38"/><text x="500.0" y="142" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">ESP32 (38-pin)</text><rect x="475" y="604" width="50" height="26" rx="4" fill="#9aa7b3"/><text x="540.0" y="622" font-size="12" font-weight="400" fill="#5b6961" text-anchor="start">USB</text><circle cx="414" cy="166" r="6" fill="#e8c35a"/><text x="428" y="171" font-size="13" font-weight="700" fill="#fff" text-anchor="start">3V3</text><path d="M408 166 L360 166" fill="none" stroke="#d03a2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="171" font-size="14" font-weight="600" fill="#d03a2f" text-anchor="end">→ breadboard + rail</text><circle cx="586" cy="166" r="6" fill="#e8c35a"/><text x="572" y="171" font-size="13" font-weight="700" fill="#fff" text-anchor="end">GND</text><path d="M592 166 L640 166" fill="none" stroke="#17201b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="648" y="171" font-size="14" font-weight="600" fill="#17201b" text-anchor="start">Relay GND</text><circle cx="414" cy="190" r="6" fill="#566573"/><text x="428" y="195" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="start">EN</text><circle cx="586" cy="190" r="6" fill="#566573"/><text x="572" y="195" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="end">23</text><circle cx="414" cy="214" r="6" fill="#e8c35a"/><text x="428" y="219" font-size="13" font-weight="700" fill="#fff" text-anchor="start">VP (36)</text><path d="M408 214 L360 214" fill="none" stroke="#0a7a75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="219" font-size="14" font-weight="600" fill="#0a7a75" text-anchor="end">Flow knob</text><circle cx="586" cy="214" r="6" fill="#566573"/><text x="572" y="219" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="end">22</text><circle cx="414" cy="238" r="6" fill="#e8c35a"/><text x="428" y="243" font-size="13" font-weight="700" fill="#fff" text-anchor="start">VN (39)</text><path d="M408 238 L360 238" fill="none" stroke="#0a7a75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="243" font-size="14" font-weight="600" fill="#0a7a75" text-anchor="end">Soil Zone 2 knob</text><circle cx="586" cy="238" r="6" fill="#566573"/><text x="572" y="243" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="end">TX</text><circle cx="414" cy="262" r="6" fill="#e8c35a"/><text x="428" y="267" font-size="13" font-weight="700" fill="#fff" text-anchor="start">34</text><path d="M408 262 L360 262" fill="none" stroke="#0a7a75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="267" font-size="14" font-weight="600" fill="#0a7a75" text-anchor="end">Solar knob</text><circle cx="586" cy="262" r="6" fill="#566573"/><text x="572" y="267" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="end">RX</text><circle cx="414" cy="286" r="6" fill="#e8c35a"/><text x="428" y="291" font-size="13" font-weight="700" fill="#fff" text-anchor="start">35</text><path d="M408 286 L360 286" fill="none" stroke="#0a7a75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="291" font-size="14" font-weight="600" fill="#0a7a75" text-anchor="end">Soil Zone 1 knob</text><circle cx="586" cy="286" r="6" fill="#566573"/><text x="572" y="291" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="end">21</text><circle cx="414" cy="310" r="6" fill="#e8c35a"/><text x="428" y="315" font-size="13" font-weight="700" fill="#fff" text-anchor="start">32</text><path d="M408 310 L360 310" fill="none" stroke="#0a7a75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="315" font-size="14" font-weight="600" fill="#0a7a75" text-anchor="end">Tank knob</text><circle cx="586" cy="310" r="6" fill="#566573"/><text x="572" y="315" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="end">GND</text><circle cx="414" cy="334" r="6" fill="#e8c35a"/><text x="428" y="339" font-size="13" font-weight="700" fill="#fff" text-anchor="start">33</text><path d="M408 334 L360 334" fill="none" stroke="#0a7a75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="339" font-size="14" font-weight="600" fill="#0a7a75" text-anchor="end">Current knob</text><circle cx="586" cy="334" r="6" fill="#e8c35a"/><text x="572" y="339" font-size="13" font-weight="700" fill="#fff" text-anchor="end">19</text><path d="M592 334 L640 334" fill="none" stroke="#7a3fb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="648" y="339" font-size="14" font-weight="600" fill="#7a3fb0" text-anchor="start">Buzzer I/O</text><circle cx="414" cy="358" r="6" fill="#e8c35a"/><text x="428" y="363" font-size="13" font-weight="700" fill="#fff" text-anchor="start">25</text><path d="M408 358 L360 358" fill="none" stroke="#7a3fb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="363" font-size="14" font-weight="600" fill="#7a3fb0" text-anchor="end">Relay IN1 (solar/grid)</text><circle cx="586" cy="358" r="6" fill="#e8c35a"/><text x="572" y="363" font-size="13" font-weight="700" fill="#fff" text-anchor="end">18</text><path d="M592 358 L640 358" fill="none" stroke="#7a3fb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="648" y="363" font-size="14" font-weight="600" fill="#7a3fb0" text-anchor="start">Relay IN4 (pump)</text><circle cx="414" cy="382" r="6" fill="#566573"/><text x="428" y="387" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="start">26</text><circle cx="586" cy="382" r="6" fill="#566573"/><text x="572" y="387" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="end">5</text><circle cx="414" cy="406" r="6" fill="#566573"/><text x="428" y="411" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="start">27</text><circle cx="586" cy="406" r="6" fill="#e8c35a"/><text x="572" y="411" font-size="13" font-weight="700" fill="#fff" text-anchor="end">17</text><path d="M592 406 L640 406" fill="none" stroke="#7a3fb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="648" y="411" font-size="14" font-weight="600" fill="#7a3fb0" text-anchor="start">Relay IN3 (valve Z2)</text><circle cx="414" cy="430" r="6" fill="#566573"/><text x="428" y="435" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="start">14</text><circle cx="586" cy="430" r="6" fill="#e8c35a"/><text x="572" y="435" font-size="13" font-weight="700" fill="#fff" text-anchor="end">16</text><path d="M592 430 L640 430" fill="none" stroke="#7a3fb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="648" y="435" font-size="14" font-weight="600" fill="#7a3fb0" text-anchor="start">Relay IN2 (valve Z1)</text><circle cx="414" cy="454" r="6" fill="#566573"/><text x="428" y="459" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="start">12</text><circle cx="586" cy="454" r="6" fill="#566573"/><text x="572" y="459" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="end">4</text><circle cx="414" cy="478" r="6" fill="#e8c35a"/><text x="428" y="483" font-size="13" font-weight="700" fill="#fff" text-anchor="start">GND</text><path d="M408 478 L360 478" fill="none" stroke="#17201b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="483" font-size="14" font-weight="600" fill="#17201b" text-anchor="end">→ breadboard − rail</text><circle cx="586" cy="478" r="6" fill="#566573"/><text x="572" y="483" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="end">0</text><circle cx="414" cy="502" r="6" fill="#566573"/><text x="428" y="507" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="start">13</text><circle cx="586" cy="502" r="6" fill="#566573"/><text x="572" y="507" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="end">2</text><circle cx="414" cy="526" r="6" fill="#6b4a4a"/><text x="428" y="531" font-size="13" font-weight="400" fill="#c98a8a" text-anchor="start">SD2</text><circle cx="586" cy="526" r="6" fill="#566573"/><text x="572" y="531" font-size="13" font-weight="400" fill="#9aa7b3" text-anchor="end">15</text><circle cx="414" cy="550" r="6" fill="#6b4a4a"/><text x="428" y="555" font-size="13" font-weight="400" fill="#c98a8a" text-anchor="start">SD3</text><circle cx="586" cy="550" r="6" fill="#6b4a4a"/><text x="572" y="555" font-size="13" font-weight="400" fill="#c98a8a" text-anchor="end">SD1</text><circle cx="414" cy="574" r="6" fill="#6b4a4a"/><text x="428" y="579" font-size="13" font-weight="400" fill="#c98a8a" text-anchor="start">CMD</text><circle cx="586" cy="574" r="6" fill="#6b4a4a"/><text x="572" y="579" font-size="13" font-weight="400" fill="#c98a8a" text-anchor="end">SD0</text><circle cx="414" cy="598" r="6" fill="#e8c35a"/><text x="428" y="603" font-size="13" font-weight="700" fill="#fff" text-anchor="start">5V</text><path d="M408 598 L360 598" fill="none" stroke="#c96a00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="603" font-size="14" font-weight="600" fill="#c96a00" text-anchor="end">Relay VCC</text><circle cx="586" cy="598" r="6" fill="#6b4a4a"/><text x="572" y="603" font-size="13" font-weight="400" fill="#c98a8a" text-anchor="end">CLK</text><text x="28" y="668" font-size="14" font-weight="400" fill="#17201b" text-anchor="start">Yellow pins = used. Grey = not used. Never use SD0–SD3, CMD, CLK (dark red): they belong to the flash chip.</text><text x="28" y="692" font-size="14" font-weight="400" fill="#5b6961" text-anchor="start">Labels vary a little by maker (e.g. G34, IO34, D34, SVP/SVN). If your board's pin order differs, go by the printed labels, not by position.</text></svg>